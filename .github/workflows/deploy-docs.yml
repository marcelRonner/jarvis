name: Build MKdocs Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PlantUML
        run: |
          sudo apt-get update && sudo apt-get install -y default-jre graphviz
          curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2024.8/plantuml-1.2024.8.jar

      # Renders every .puml discovered under docs/ — the Makefile is the single
      # source of truth, so local and CI output can never diverge.
      - name: Generate PlantUML diagrams
        run: make diagrams PLANTUML="java -jar ${{ github.workspace }}/plantuml.jar"

      - name: Lint documentation
        run: make lint

      - name: Build MkDocs
        run: mkdocs build --strict
      
      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # server-dir: ./public_html/ # Change this to the folder on your server
